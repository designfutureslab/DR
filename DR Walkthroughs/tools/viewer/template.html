<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/*__CSS__*/

<body>
<header class="bar">
  <div class="brand">
    <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 18 L10 8 L14 14 L20 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="5" r="2.2" fill="currentColor"/></svg></span>
    <div>
      <h1 id="doc-title">__TITLE__</h1>
      <p id="doc-sub"></p>
    </div>
  </div>
  <nav class="modes" aria-label="Mode">
    <button id="mode-walk" class="on" type="button">Walkthrough</button>
    <button id="mode-explore" type="button">Explore clusters</button>
  </nav>
  <label class="step-select" for="step-select"><span class="sr">Jump to step</span><select id="step-select"></select></label>
</header>
<div class="app">
  <nav class="rail" id="rail" aria-label="Steps"></nav>
  <main class="stage">
    <div class="crumbs" id="crumbs"></div>
    <div class="canvas-wrap" id="wrap">
      <svg id="cv" xmlns="http://www.w3.org/2000/svg" aria-label="Grasshopper canvas"></svg>
      <div class="pins" id="pins"></div>
      <div class="tip-box" id="tip" hidden></div>
      <div class="zoom" role="group" aria-label="Zoom">
        <button type="button" id="z-in" title="Zoom in">+</button>
        <button type="button" id="z-out" title="Zoom out">&minus;</button>
        <button type="button" id="z-fit" title="Frame this step">Frame</button>
        <button type="button" id="z-all" title="Show whole canvas">All</button>
      </div>
      <p class="hint">Drag to pan &middot; scroll or pinch to zoom &middot; click any component for details</p>
    </div>
  </main>
  <aside class="notes" id="notes" aria-live="polite"></aside>
</div>
<script>
/*__DATA__*/
</script>

/*__JS__*/
</script>
</body>
</html>
